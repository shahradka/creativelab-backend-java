spring.application.name=user
server.port=8081

# Runtime configuration. Defaults keep local development working; Cloudflare
# containers override these with SPRING_DATASOURCE_* environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep pools small: managed Postgres usually enforces a connection cap per user.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:10}

spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}

# Container health endpoint (used by the Cloudflare Worker).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger UI. Disable in production with SPRINGDOC_ENABLED=false.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=top.creativelab.user.adapters.inbound.rest

# Give in-flight requests and Flyway a chance to finish on SIGTERM.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
